version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /etc
  read_write:
    - /tmp

process:
  run_as_user: "65532"
  run_as_group: "65532"

network_policies:
  telegram:
    endpoints:
      - host: api.telegram.org
        port: 443
    binaries:
      - path: /usr/local/bin/python3.12

  nebius:
    endpoints:
      - host: api.tokenfactory.nebius.com
        port: 443
    binaries:
      - path: /usr/local/bin/python3.12

  modal:
    endpoints:
      - host: "*.modal.run"
        port: 443
    binaries:
      - path: /usr/local/bin/python3.12

  # Parakeet-EOU ASR runs on the Oracle Cloud VM (gRPC, run by compose.yaml).
  # Replace the host with the VM address reachable from inside the sandbox,
  # for example the instance private IP (10.0.0.10) or the Docker host gateway
  # (host.docker.internal). Then point the bot at it with:
  #     PARAKEET_GRPC_TARGET=<host>:50051
  parakeet_asr:
    endpoints:
      - host: "host.docker.internal"
        port: 50051
    binaries:
      - path: /usr/local/bin/python3.12

  # OYI webapp: hosts /ws/device (phone WebSocket) and /api/device/* (command
  # API used by the Telegram bot and the agent's control_phone tool).
  # Replace the host with the public domain of the webapp, then point the bot
  # at it with:
  #     OYI_DEVICE_GATEWAY_URL=https://<host>
  oyi_webapp:
    endpoints:
      - host: "150-230-152-243.sslip.io"
        port: 443
    binaries:
      - path: /usr/local/bin/python3.12

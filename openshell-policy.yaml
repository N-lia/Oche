version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /etc
  read_write:
    - /tmp

process:
  run_as_user: "65532"
  run_as_group: "65532"

network_policies:
  telegram:
    endpoints:
      - host: api.telegram.org
        port: 443
    binaries:
      - path: /usr/local/bin/python3.12

  nebius:
    endpoints:
      - host: api.tokenfactory.nebius.com
        port: 443
    binaries:
      - path: /usr/local/bin/python3.12
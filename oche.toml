# Oche: everything is a plugin. Plugins load top to bottom; prefix a name with "~" to disable it.
# The engine is a LangChain Deep Agent built from the tools and prompt sections these plugins register.
# Each plugin's prompt section lives in oche/prompts/<name>.txt (override with `prompt = "..."`).

[plugins.llm]                          # `llm` service: ChatOpenAI per model id
base_url = "https://api.tokenfactory.nebius.com/v1/"
api_key_env = "NEBIUS_API_KEY"
model = "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B"
thinking = ["nvidia/Nemotron-3-Ultra-550b-a55b"]   # every other model runs with thinking off

[plugins.agent]                        # the Deep Agent engine -> `agent` service

[plugins.privacy]                      # scrub PII before the model sees it, restore after

[plugins.clock]                        # live date/time on every turn

[plugins.router]                       # pick a model tier per turn (router.py)

[plugins.workspace]                    # Deep Agents filesystem backend in WORKSPACE_DIR

[plugins.subagent]                     # spawn_subagent: background work

[plugins.tavily]                       # web search

[plugins.memory]                       # Mem0 long-term memory

[plugins.voice]                        # voice notes

[plugins.telegram]                     # replies as Telegram HTML

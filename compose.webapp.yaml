# OYI Live WebApp + Caddy (TLS) on the Oracle Cloud VM.
#
#   docker compose up -d --build
#   docker compose logs -f caddy      # watch certificate issuance
#
# Requires:
#   - WEBAPP_DOMAIN in .env resolving to this VM's public IP
#   - inbound TCP 80 + 443 open in the OCI VCN security list
#   - the parakeet-asr service reachable on the host at :50051

services:
  webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    image: oyi-webapp:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WEBAPP_PORT: "8000"
      # Reach the on-host gRPC ASR (same as the Telegram bot).
      PARAKEET_GRPC_TARGET: "host.docker.internal:50051"
      # Warn (with stack) when something blocks the asyncio loop: the stall
      # hunter for "agent reply never arrives while the loop looks alive".
      WEBAPP_DEBUG_LOOP: "1"
      # Voice: Phonon runs in-process on the VM - no Modal round trip,
      # WAV instead of MP3 (crisp), pacing mapped from the session mood.
      TTS_PROVIDER: "phonon"
      PHONON_MODEL_DIR: "/opt/phonon"
      PHONON_THREADS: "2"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The WebApp keeps its own memory store (Qdrant local mode locks its dir,
      # so it cannot share the bot's volume safely).
      - oyi-webapp-memory:/data/oyi-memory
      - backchannel-cache:/app/data/backchannels
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - webapp
    environment:
      WEBAPP_DOMAIN: "${WEBAPP_DOMAIN:?set WEBAPP_DOMAIN in .env}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  oyi-webapp-memory:
  backchannel-cache:
  caddy-data:
  caddy-config:

name: Android APK

on:
  push:
    branches:
      - android-device-app
      - main
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    # Pinned: the "latest" image is migrating to Ubuntu 26, where the
    # preinstalled Android SDK layout (and setup-android@v3) no longer works.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      ANDROID_CMDLINE_TOOLS: commandlinetools-linux-11076708_latest.zip

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The Android SDK is installed explicitly instead of relying on
      # setup-android, so the build does not depend on the runner image layout.
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/${ANDROID_CMDLINE_TOOLS}"
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('android/**/*.kts') }}
          restore-keys: gradle-android-

      - name: Assemble debug APK
        id: build
        working-directory: android
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log

      # Surface the failure reason in the run summary and as annotations so a
      # broken build can be diagnosed without opening the raw log.
      - name: Publish build diagnostics
        if: steps.build.outcome == 'failure'
        run: |
          {
            echo "### Gradle build failed"
            echo
            echo '```'
            sed -n '/FAILURE: Build failed/,/^\* Try:/p' /tmp/gradle-build.log | head -60 || true
            echo '```'
            echo
            echo '```'
            grep -E "^e: |error:|Caused by:|What went wrong|Could not|Unsupported|requires " \
              /tmp/gradle-build.log | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            sed -n '/FAILURE: Build failed/,/^\* Try:/p' /tmp/gradle-build.log | head -40
            grep -E "^e: |error:|Caused by:|What went wrong|Could not|Unsupported" \
              /tmp/gradle-build.log | head -40
          } | while IFS= read -r line; do
            echo "::error title=Gradle build failed::${line}"
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: oyi-device-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

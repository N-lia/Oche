name: Android APK

on:
  push:
    branches:
      - android-device-app
      - echo-blocker
      - main
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    # Pinned: the "latest" image is migrating to Ubuntu 26, where the
    # preinstalled Android SDK layout (and setup-android@v3) no longer works.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # contents: write lets the job publish its snapshots to a side branch.
    permissions:
      contents: write

    env:
      ANDROID_CMDLINE_TOOLS: commandlinetools-linux-11076708_latest.zip

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The Android SDK is installed explicitly instead of relying on
      # setup-android, so the build does not depend on the runner image layout.
      - name: Install Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/${ANDROID_CMDLINE_TOOLS}"
          unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK_ROOT" --licenses > /dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('android/**/*.kts') }}
          restore-keys: gradle-android-

      - name: Assemble debug APK
        id: build
        working-directory: android
        continue-on-error: true
        env:
          # The app's versionCode: the in-app updater compares it with the
          # latest release's build number.
          OYI_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log

      # Surface the failure reason in the run summary and as annotations so a
      # broken build can be diagnosed without opening the raw log.
      - name: Publish build diagnostics
        if: steps.build.outcome == 'failure'
        run: |
          {
            echo "### Gradle build failed"
            echo
            echo '```'
            sed -n '/FAILURE: Build failed/,/^\* Try:/p' /tmp/gradle-build.log | head -60 || true
            echo '```'
            echo
            echo '```'
            grep -E "^e: |error:|Caused by:|What went wrong|Could not|Unsupported|requires |FAILED$|AssertionError" \
              /tmp/gradle-build.log | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            sed -n '/FAILURE: Build failed/,/^\* Try:/p' /tmp/gradle-build.log | head -40
            grep -E "^e: |error:|Caused by:|What went wrong|Could not|Unsupported|FAILED$|AssertionError" \
              /tmp/gradle-build.log | head -40
          } | while IFS= read -r line; do
            echo "::error title=Gradle build failed::${line}"
          done
          exit 1

      - name: Upload island snapshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: island-snapshots
          path: android/app/build/reports/paparazzi/**/*.png
          if-no-files-found: warn

      # Pushes the rendered screens to snapshots/pr-<n> so they can be read
      # with plain git (the artifact store is not reachable from every
      # environment). The branch only ever holds the latest images.
      - name: Publish snapshots to a branch
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          BRANCH: snapshots/pr-${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(android/app/build/reports/paparazzi/**/*.png)
          if [ ${#files[@]} -eq 0 ]; then echo "No snapshots"; exit 0; fi
          out=$(mktemp -d)
          for f in "${files[@]}"; do cp "$f" "$out/"; done
          # Paparazzi names report images by hash; keep its index so each
          # image can be matched to its test.
          cp -r android/app/build/reports/paparazzi/*/runs "$out/" 2>/dev/null || true
          cd "$out"
          git init -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Snapshots for $HEAD_SHA"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/$BRANCH"

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: oyi-device-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Over-the-air updates: every green build of the app branches becomes a
      # GitHub release named build-<run number> with the APK attached. The
      # app checks the latest release and offers to install it.
      - name: Publish release for in-app updates
        # Also for pull requests from this repo, so a branch under test can be
        # updated over the air before it is merged.
        if: >-
          (github.event_name == 'push' && (github.ref == 'refs/heads/echo-blocker' || github.ref == 'refs/heads/main')) ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
          TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
          NOTES: ${{ github.event.pull_request.title || 'Latest build' }}
        run: |
          set -euo pipefail
          apk=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          cp "$apk" "oyi-${TAG}.apk"
          gh release create "$TAG" "oyi-${TAG}.apk" \
            --repo "${{ github.repository }}" \
            --target "$TARGET" \
            --title "OYI ${TAG}" \
            --notes "$NOTES" \
            --latest
